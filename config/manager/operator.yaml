apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-operator
  namespace: sentinel-system
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: sentinel-operator}}
  template:
    metadata: {labels: {app.kubernetes.io/name: sentinel-operator}}
    spec:
      serviceAccountName: sentinel-operator
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: manager
          image: sentinel:latest
          imagePullPolicy: IfNotPresent
          args: [--mode=operator, --leader-elect=true]
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8081}
            - {name: api, containerPort: 8090}
          readinessProbe: {httpGet: {path: /readyz, port: health}, initialDelaySeconds: 3, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: health}, initialDelaySeconds: 10, periodSeconds: 20}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-api
  namespace: sentinel-system
spec:
  selector: {app.kubernetes.io/name: sentinel-operator}
  ports:
    - {name: http, port: 8090, targetPort: api}
