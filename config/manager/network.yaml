# Optional Phase 2: kubectl apply -f config/manager/network.yaml
apiVersion: v1
kind: ServiceAccount
metadata: {name: sentinel-network-monitor, namespace: sentinel-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: sentinel-network-monitor}
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: sentinel-network-monitor}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sentinel-network-monitor}
subjects: [{kind: ServiceAccount, name: sentinel-network-monitor, namespace: sentinel-system}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sentinel-network-monitor, namespace: sentinel-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: sentinel-network-monitor}}
  template:
    metadata: {labels: {app: sentinel-network-monitor}}
    spec:
      serviceAccountName: sentinel-network-monitor
      containers:
        - name: monitor
          image: sentinel:latest
          imagePullPolicy: IfNotPresent
          args: [--mode=network-monitor, --network-interval=5s, --network-timeout=3s]
          ports: [{name: api, containerPort: 8090}]
          readinessProbe: {httpGet: {path: /healthz, port: api}}
          livenessProbe: {httpGet: {path: /healthz, port: api}}
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
